name: Teste Windows LinkOn

on:
  workflow_dispatch:
  push:

jobs:
  teste:
    runs-on: windows-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: 1 - Sintaxe do script
        shell: powershell
        run: |
          $erros = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\LinkOn-Instalador.ps1", [ref]$null, [ref]$erros)
          if ($erros) {
            $erros | ForEach-Object { Write-Host "::error::Linha $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "[OK] Sintaxe sem erros"

      - name: 2 - Arquivos JSON
        shell: powershell
        run: |
          $p = Get-Content perfil.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $p.Versao) { Write-Host "::error::perfil.json sem Versao"; exit 1 }
          Write-Host "[OK] perfil.json - Versao: $($p.Versao) | Programas: $($p.Programas -join ', ')"
          $a = @(Get-Content anuncios.json -Raw -Encoding UTF8 | ConvertFrom-Json)
          foreach ($x in $a) { if (-not ($x.Tag -and $x.Titulo)) { Write-Host "::error::anuncio sem Tag/Titulo"; exit 1 } }
          Write-Host "[OK] anuncios.json - $($a.Count) anuncios"

      - name: 3 - Script online (o mesmo comando do cliente)
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/LinkOn-Instalador.ps1"
          $online = Invoke-RestMethod $url -UseBasicParsing
          $erros = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($online, [ref]$null, [ref]$erros)
          if ($erros) { Write-Host "::error::Script baixado com irm tem erro: $($erros[0].Message)"; exit 1 }
          if ($online -notmatch 'Office Suite') { Write-Host "::error::Acentos/conteudo corrompidos no download"; exit 1 }
          Write-Host "[OK] irm baixa e le o script corretamente ($($online.Length) caracteres)"

      - name: 4 - Janela, analise do PC, Office e otimizador (sem instalar nada)
        shell: powershell
        run: |
          $src = Get-Content LinkOn-Instalador.ps1 -Raw -Encoding UTF8
          $testes = @'
          $falhas = 0
          function Checar([string]$nome, [scriptblock]$b) {
              try { $r = & $b; Write-Host "[OK]    $nome  $r" }
              catch { $script:falhas++; Write-Host "::error::[FALHA] $nome - $($_.Exception.Message)" }
          }
          Checar 'Janela montada'      { if (-not $form -or $form.Controls.Count -lt 5) { throw 'form incompleto' }; "$($form.Controls.Count) controles" }
          Checar 'Analise do PC'       { $script:REC = Analisar-PC; "$($script:REC.OS) | $($script:REC.RAM) GB | $($script:REC.TipoDisco)" }
          Checar 'Diagnostico'         { Mostrar-Diagnostico; if (-not $lblDiag.Text) { throw 'vazio' }; 'preenchido' }
          Checar 'Recomendado'         { Aplicar-Recomendado; if (-not $PRODUTOS.Contains([string]$cmbProd.SelectedItem)) { throw 'versao invalida' }; $cmbProd.SelectedItem }
          Checar 'Perfil online'       { if (-not (Carregar-Perfil)) { throw $lblPerfil.Text }; $lblPerfil.Text }
          Checar 'Anuncios online'     { Carregar-Anuncios; if ($script:ANUNCIOS.Count -eq 0) { throw 'nenhum' }; "$($script:ANUNCIOS.Count) ativos" }
          Checar 'Painel propaganda'   { Propaganda $true; if (-not $painelAd.Visible) { throw 'nao apareceu' }; Propaganda $false; 'ok' }
          Checar 'Barra de progresso'  { Log 'teste' 50; if ($barra.Value -ne 50) { throw "valor $($barra.Value)" }; '50%' }
          Checar 'XML das versoes'     {
              $n = 0
              foreach ($k in $PRODUTOS.Keys) {
                  $id, $suf = $PRODUTOS[$k] -split '\|'
                  foreach ($bits in '64', '32') {
                      [xml]$x = Gerar-XML $id $suf @('Access') 'pt-br' $bits $true $true $true
                      if ($x.Configuration.Add.Product[0].ID -ne $id) { throw "XML errado: $k" }
                      $n++
                  }
              }
              "$n configuracoes validas"
          }
          Checar 'Pasta protegida'     { $ruim = (Get-Acl $PASTA_ODT).Access | Where-Object { $_.IdentityReference -match 'Users' -and $_.FileSystemRights -match 'Write|Modify|FullControl' }; if ($ruim) { throw 'usuarios comuns podem gravar' }; 'so administradores' }
          Checar 'Download Microsoft'  { if (-not (Baixar-ODT)) { throw 'falhou' }; (Get-AuthenticodeSignature $SETUP).SignerCertificate.Subject.Split(',')[0] }
          Checar 'Assinatura'          { if (-not (Assinatura-OK $SETUP)) { throw 'invalida' }; 'Microsoft valida' }
          Checar 'Office instalado?'   { "$(@(Office-Instalado).Count) encontrados" }
          Checar 'Salvar perfil'       { Salvar-Perfil; if (-not (Test-Path $PERFIL)) { throw 'nao salvou' }; Remove-Item $PERFIL; 'ok' }
          Checar 'Ajustes otimizador'  { $n = 0; foreach ($l in $AJUSTES.Values) { foreach ($a in $l) { if (-not ($a.P -and $a.N -and $a.T)) { throw "incompleto: $($a.N)" }; $n++ } }; "$n ajustes" }
          Checar 'Energia (powercfg)'  { $g = ([regex]::Match((powercfg /getactivescheme), '[0-9a-fA-F-]{36}')).Value; if (-not $g) { throw 'sem resposta' }; $g }
          Checar 'Otimizar disco'      { if (-not (Get-Command Optimize-Volume -ErrorAction SilentlyContinue)) { throw 'indisponivel' }; 'disponivel' }
          Write-Host ""
          if ($falhas) { Write-Host "::error::$falhas teste(s) falharam"; exit 1 } else { Write-Host "TODOS OS TESTES PASSARAM" ; exit 0 }
          '@
          if ($src -notmatch '\[void\]\$form\.ShowDialog\(\)') { Write-Host "::error::fim do script nao encontrado"; exit 1 }
          $src = $src -replace '\[void\]\$form\.ShowDialog\(\)', $testes.Replace('$', '$$')
          $arq = Join-Path $env:RUNNER_TEMP 'linkon-teste.ps1'
          [IO.File]::WriteAllText($arq, $src, (New-Object Text.UTF8Encoding $true))
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File $arq
          exit $LASTEXITCODE
